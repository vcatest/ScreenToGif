name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest  # CHANGED: Use Windows to support WPF/.NET 9
    # Removed 'container' as it is not needed for Windows runners

    steps:
    - uses: actions/checkout@v4
    
    # NEW: Setup Java natively for Windows (Required for Embold)
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '11'
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
        
    - name: Build Project
      run: |
        # PowerShell script to find .sln and build
        $solution = Get-ChildItem -Recurse -Filter "*.sln" | Select-Object -First 1
        
        if ($null -eq $solution) {
            Write-Error "No Solution (.sln) file found!"
            exit 1
        }
        
        Write-Host "Found Solution: $($solution.FullName)"
        
        # Restore and Build
        dotnet restore $solution.FullName
        dotnet build $solution.FullName --configuration Release

    - name: Embold Analyse
      shell: pwsh
      run: |
        curl ${{ vars.EMBOLD_SCANNER_URL }} -o browserstack-codequality-scanner-archive.tar.gz
        tar xvf browserstack-codequality-scanner-archive.tar.gz
        echo "Download and extract BrowserStack CQ Scanner done"
        curl --silent --location --request GET "${{ vars.EMBOLD_URL_CS }}/api/v1/repositories/8f045665361dcb86eba38bf8e7bf992c/scans/config/download" --header "Authorization:Bearer ${{ secrets.EMBOLD_TOKEN_CS }}" -o repository-configuration.json
        echo "Download repository configuration file done"
        ./browserstack-codequality-scanner/bin/embold-scanner analyse -u ${{ vars.EMBOLD_URL_CS }} -t "${{ secrets.EMBOLD_TOKEN_CS }}" -r 8f045665361dcb86eba38bf8e7bf992c -b . -d ./embold-data -c ./repository-configuration.json -v
