name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest  # CHANGED: Use Windows to support WPF/.NET 9
    # Removed 'container' as it is not needed for Windows runners

    steps:
    - uses: actions/checkout@v4
    
    # NEW: Setup Java natively for Windows (Required for Embold)
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '11'
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
        
    - name: Build Project
      run: |
        # PowerShell script to find .sln and build
        $solution = Get-ChildItem -Recurse -Filter "*.sln" | Select-Object -First 1
        
        if ($null -eq $solution) {
            Write-Error "No Solution (.sln) file found!"
            exit 1
        }
        
        Write-Host "Found Solution: $($solution.FullName)"
        
        # Restore and Build
        dotnet restore $solution.FullName
        dotnet build $solution.FullName --configuration Release

    - name: Embold Analyse
      shell: pwsh
      run: |
        # 1. Download Scanner
        # CRITICAL: Ensure ${{ vars.EMBOLD_SCANNER_URL }} points to the WINDOWS (.zip) version.
        Write-Host "Downloading Scanner from ${{ vars.EMBOLD_SCANNER_URL }}..."
        curl "${{ vars.EMBOLD_SCANNER_URL }}" -o scanner.zip
        
        # 2. Extract Scanner
        Write-Host "Extracting Scanner..."
        Expand-Archive -Path scanner.zip -DestinationPath . -Force
        
        # 3. Download Configuration
        Write-Host "Downloading Config..."
        $headers = @{ Authorization = "Bearer ${{ secrets.EMBOLD_TOKEN_CS }}" }
        $configUrl = "${{ vars.EMBOLD_URL_CS }}/api/v1/repositories/8f045665361dcb86eba38bf8e7bf992c/scans/config/download"
        Invoke-WebRequest -Uri $configUrl -Headers $headers -OutFile repository-configuration.json
        
        # 4. Run Analysis
        # Note: Windows uses backslashes and usually a .bat file
        Write-Host "Starting Analysis..."
        
        # Adjust path below if the zip extracts to a specific folder name
        .\browserstack-codequality-scanner\bin\embold-scanner.bat analyse -u "${{ vars.EMBOLD_URL_CS }}" -t "${{ secrets.EMBOLD_TOKEN_CS }}" -r 8f045665361dcb86eba38bf8e7bf992c -b . -d .\embold-data -c .\repository-configuration.json -v
